<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
<title>Lake Burton Property Directory</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div id="app">

  <header class="app-header">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="20" r="19" stroke="#CBA766" stroke-width="1.5"/>
        <path d="M20 4 L23 18 L20 20 L17 18 Z" fill="#CBA766"/>
        <path d="M20 36 L17 22 L20 20 L23 22 Z" fill="#F3EEE2" fill-opacity="0.4"/>
        <circle cx="20" cy="20" r="2.6" fill="#F3EEE2"/>
      </svg>
      <div class="brand-text">
        <span class="eyebrow">Rabun County · GA</span>
        <h1>Lake Burton Property Directory</h1>
      </div>
    </div>

    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input id="searchInput" type="text" placeholder="Search address, account #, owner, or phone…" autocomplete="off" />
      <div class="search-results" id="searchResults"></div>
    </div>
    <span class="search-results-count" id="searchCount"></span>

    <button class="filter-toggle" id="myNotesToggle">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12h6M9 16h6M9 8h6M5 3h14a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/></svg>
      My Notes
    </button>

    <button class="filter-toggle" id="filterToggle">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="20" y2="12"/><line x1="12" y1="18" x2="20" y2="18"/><circle cx="6" cy="12" r="1.8" fill="currentColor"/><circle cx="9" cy="18" r="1.8" fill="currentColor"/></svg>
      Filters
    </button>
  </header>

  <div class="my-notes-overlay" id="myNotesOverlay" style="display:none;">
    <div class="my-notes-panel">
      <div class="my-notes-header">
        <h2>My Notes</h2>
        <button class="my-notes-close" id="myNotesClose" aria-label="Close">&times;</button>
      </div>
      <div class="my-notes-list" id="myNotesList"></div>
    </div>
  </div>

  <div class="main-layout" id="mainLayout">

    <div class="map-pane">
      <div id="map"></div>

      <div class="map-result-count" id="mapResultCount"></div>

      <div class="map-legend">
        <span class="legend-item"><span class="dot paid"></span> Fully Paid</span>
        <span class="legend-item"><span class="dot delinquent"></span> Tax Delinquent</span>
      </div>

      <div class="filter-drawer" id="filterDrawer">
        <h3>Filter properties</h3>

        <div class="filter-group">
          <label class="field-label">Tax status</label>
          <label class="check-row"><input type="checkbox" class="filter-status" value="Fully Paid" checked> Fully Paid</label>
          <label class="check-row"><input type="checkbox" class="filter-status" value="Tax Delinquent" checked> Tax Delinquent</label>
        </div>

        <div class="filter-group">
          <label class="field-label">Property value range</label>
          <div class="range-row">
            <input type="number" id="valueMin" placeholder="Min $" min="0" step="1000">
            <span>–</span>
            <input type="number" id="valueMax" placeholder="Max $" min="0" step="1000">
          </div>
        </div>

        <button class="filter-clear" id="filterClear">Clear filters</button>

        <div class="filter-group notes-backup-group">
          <label class="field-label">Notes backup</label>
          <div class="notes-backup-row">
            <button class="backup-btn" id="exportNotesBtn">Export Notes</button>
            <button class="backup-btn" id="importNotesBtn">Import Notes</button>
          </div>
          <input type="file" id="importNotesFile" accept="application/json" hidden>
        </div>
      </div>
    </div>

    <div class="resize-handle" id="resizeHandle"></div>

    <div class="side-panel" id="sidePanel">
      <aside class="directory-panel" id="directoryPanel">
        <div class="panel-empty-state">
          <span class="eyebrow">Directory</span>
          <h2>Select a pin on the map</h2>
          <p>Click any marker to open the full property profile — owner details, sales history, and possible relatives. Or browse the list below.</p>
        </div>
        <ul class="directory-list" id="directoryList"></ul>
      </aside>

      <aside class="profile-panel" id="profilePanel" style="display:none;"></aside>
    </div>

  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
