  --forest:       #2F4A3D;
  --brass:        #B08D57;

  --font-mono:    'IBM Plex Mono', 'SFMono-Regular', Menlo, monospace;

.app-header {
  display: flex;

  padding: 0 18px;

  flex-shrink: 0;
}

.brand-mark { width: 30px; height: 30px; flex-shrink: 0; }

.brand-text { display: flex; flex-direction: column; line-height: 1.05; }

.brand-text .eyebrow {
  font-family: var(--font-mono);
  font-size: 9.5px;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: var(--brass-bright);
}

.brand-text h1 {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 18px;
  margin: 2px 0 0;
  white-space: nowrap;
}

.search-wrap { position: relative; flex: 1; max-width: 440px; min-width: 0; }

.search-wrap input {
  width: 100%;
  padding: 9px 14px 9px 36px;
  border-radius: var(--radius-md);
  border: 1px solid transparent;
  background: rgba(255,255,255,0.1);
  color: var(--paper);
  font-family: var(--font-body);
  font-size: 14px;
  outline: none;
  transition: background 0.2s ease, box-shadow 0.2s ease;
}
.search-wrap input::placeholder { color: rgba(243,238,226,0.55); }
.search-wrap input:focus { background: rgba(255,255,255,0.16); box-shadow: 0 0 0 2px var(--brass-bright); }

.search-icon {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  width: 15px; height: 15px; color: rgba(243,238,226,0.6); pointer-events: none;
}

/* search results dropdown */
.search-results {
  position: absolute;
  top: calc(100% + 6px);
  left: 0; right: 0;
  background: var(--paper);
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow);
  max-height: 340px;
  overflow-y: auto;
  z-index: 40;
  display: none;
}
.search-results.open { display: block; }
.search-result-item {
  display: block;
  width: 100%;
  text-align: left;
  padding: 10px 14px;
  border: none;
  border-bottom: 1px solid var(--line);
  background: var(--white);
  cursor: pointer;
  color: var(--ink);
  font-family: var(--font-body);
}
.search-result-item:last-child { border-bottom: none; }
.search-result-item:hover, .search-result-item.active { background: var(--paper-dim); }
.search-result-item .sr-title { font-family: var(--font-display); font-size: 13.5px; font-weight: 600; }
.search-result-item .sr-meta { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-muted); margin-top: 2px; }
.search-results-empty { padding: 14px; font-size: 12.5px; color: var(--ink-muted); font-style: italic; }

.search-results-count {
  font-family: var(--font-mono); font-size: 10.5px; color: var(--brass-bright);
  min-width: 56px; text-align: right; flex-shrink: 0;
}

.filter-toggle {
  display: flex; align-items: center; gap: 7px;
  background: transparent; border: 1px solid rgba(243,238,226,0.3); color: var(--paper);
  padding: 8px 13px; border-radius: var(--radius-md); font-family: var(--font-body);
  font-size: 13px; cursor: pointer; transition: background 0.15s ease, border-color 0.15s ease;
  flex-shrink: 0; white-space: nowrap;
}
.filter-toggle:hover { background: rgba(255,255,255,0.08); border-color: var(--brass-bright); }
.filter-toggle.active { background: var(--brass); border-color: var(--brass); color: var(--navy-deep); font-weight: 600; }

/* ---------------------------------- main layout ---------------------------------- */
.main-layout {
  position: relative;
  display: flex;
  height: 100%;
  overflow: hidden;
  min-height: 0;
}

.map-pane { flex: 1 1 auto; position: relative; min-width: 0; }
#map { height: 100%; width: 100%; background: #cfe0e8; }
.leaflet-container { font-family: var(--font-body); background: #cfe0e8; }

/* resize handle between map and panel (desktop only) */
.resize-handle {
  flex: 0 0 6px;
  cursor: col-resize;
  background: var(--line);
  position: relative;
  z-index: 25;
  transition: background 0.15s ease;
}
.resize-handle:hover, .resize-handle.dragging { background: var(--brass); }
.resize-handle::after {
  content: '';
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: 3px; height: 32px; border-radius: 3px; background: var(--paper);
  opacity: 0.6;
}

/* ---------------------------------- filter drawer ---------------------------------- */
.filter-drawer {
  position: absolute; top: 12px; right: 12px; width: 270px;
  background: var(--paper); border: 1px solid var(--line-strong); border-radius: var(--radius-lg);
  box-shadow: var(--shadow); padding: 16px 18px 18px; z-index: 20;
  transform: translateY(-12px) scale(0.98); opacity: 0; pointer-events: none;
  transition: transform 0.18s ease, opacity 0.18s ease;
}
.filter-drawer.open { transform: translateY(0) scale(1); opacity: 1; pointer-events: auto; }
.filter-drawer h3 {
  font-family: var(--font-display); font-size: 14.5px; margin: 0 0 12px;
  padding-bottom: 8px; border-bottom: 1px solid var(--line);
}
.filter-group { margin-bottom: 15px; }
.filter-group:last-child { margin-bottom: 0; }
.filter-group label.field-label {
  display: block; font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--ink-muted); margin-bottom: 8px;
}
.check-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 12.5px; }
.check-row input { accent-color: var(--forest); }
.range-row { display: flex; align-items: center; gap: 8px; }
.range-row input[type="number"] {
  width: 100%; padding: 6px 8px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm);
  font-family: var(--font-mono); font-size: 12px; background: var(--white);
}
.filter-clear {
  margin-top: 14px; width: 100%; padding: 8px; background: transparent; border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm); font-size: 12px; cursor: pointer; color: var(--ink-muted);
}
.filter-clear:hover { border-color: var(--delinquent); color: var(--delinquent); }

.notes-backup-group { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
.notes-backup-row { display: flex; gap: 8px; }
.backup-btn {
  flex: 1; padding: 8px 6px; background: transparent; border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm); font-size: 11.5px; font-family: var(--font-body); font-weight: 600;
  color: var(--forest); cursor: pointer;
}
.backup-btn:hover { border-color: var(--forest); background: rgba(47,74,61,0.06); }

/* ---------------------------------- map controls ---------------------------------- */
.map-legend {
  position: absolute; bottom: 22px; left: 12px; z-index: 20;
  background: var(--paper); border: 1px solid var(--line-strong); border-radius: var(--radius-md);
  padding: 8px 12px; font-size: 11px; box-shadow: var(--shadow-soft);
  display: flex; gap: 12px; align-items: center;
}
.map-legend .legend-item { display: flex; align-items: center; gap: 5px; }
.map-legend .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.map-legend .dot.paid { background: var(--forest); }
.map-legend .dot.delinquent { background: var(--delinquent); }
.map-result-count {
  position: absolute; top: 12px; left: 12px; z-index: 20;
  background: var(--navy); color: var(--paper); font-family: var(--font-mono); font-size: 11px;
  padding: 6px 11px; border-radius: 20px; box-shadow: var(--shadow-soft);
}

/* ---------------------------------- markers (small, modern) ---------------------------------- */
.pin {
  position: relative; width: 15px; height: 19px; cursor: pointer;
  transform-origin: 50% 100%;
  transition: transform 0.15s cubic-bezier(.34,1.56,.64,1), filter 0.15s ease, opacity 0.15s ease;
}
.pin svg { display: block; width: 100%; height: 100%; overflow: visible; }
.pin .pin-body { fill: var(--forest); stroke: var(--white); stroke-width: 1.2; }
.pin.status-delinquent .pin-body { fill: var(--delinquent); }
.pin .pin-dot { fill: var(--white); }

.pin:hover { transform: translateY(-2px) scale(1.25); filter: drop-shadow(0 4px 6px rgba(14,33,41,0.4)); z-index: 900 !important; }

.pin.is-active { transform: translateY(-3px) scale(1.5); z-index: 1000 !important; }
.pin.is-active .pin-body { stroke: var(--brass-bright); stroke-width: 2; }
.pin.is-dimmed { opacity: 0.3; }

/* marker cluster icons — custom, on-brand */
.lb-cluster {
  display: flex; align-items: center; justify-content: center;
  background: var(--navy);
  color: var(--paper);
  border: 2px solid var(--brass);
  border-radius: 50%;
  font-family: var(--font-mono);
  font-weight: 600;
  box-shadow: var(--shadow-soft);
}
.lb-cluster span { line-height: 1; }
.lb-cluster.size-sm { width: 32px; height: 32px; font-size: 12px; }
.lb-cluster.size-md { width: 40px; height: 40px; font-size: 13px; }
.lb-cluster.size-lg { width: 48px; height: 48px; font-size: 14px; }

.leaflet-tooltip.pin-tooltip {
  background: var(--navy-deep); color: var(--paper);
  border: 1px solid var(--brass); font-family: var(--font-body); font-size: 12px;
  padding: 5px 9px; border-radius: var(--radius-sm); box-shadow: var(--shadow-soft);
}
.leaflet-tooltip.pin-tooltip::before { border-top-color: var(--brass); }

/* ---------------------------------- directory / profile panel ---------------------------------- */
.side-panel {
  flex: 0 0 var(--panel-width);
  width: var(--panel-width);
  min-width: var(--panel-min);
  max-width: var(--panel-max);
  background: var(--paper);
  border-left: 1px solid var(--line-strong);
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.directory-panel, .profile-panel { height: 100%; overflow-y: auto; }

.panel-empty-state { padding: 26px 24px; }
.panel-empty-state .eyebrow {
  font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--brass);
}
.panel-empty-state h2 { font-family: var(--font-display); font-size: 20px; margin: 6px 0 4px; }
.panel-empty-state p { color: var(--ink-muted); font-size: 13px; line-height: 1.55; margin: 0 0 16px; }

.directory-list-heading {
  font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--brass); margin: 4px 16px 8px; padding-top: 14px; border-top: 1px solid var(--line);
}
.directory-list { list-style: none; margin: 0; padding: 0 16px 20px; }
.directory-item {
  display: block; width: 100%; text-align: left; padding: 12px 14px; border: 1px solid var(--line);
  border-radius: var(--radius-md); background: var(--white); margin-bottom: 7px; cursor: pointer;
  transition: border-color 0.15s ease, transform 0.12s ease;
}
.directory-item:hover { border-color: var(--brass); transform: translateX(2px); }
.directory-item .di-title { font-family: var(--font-display); font-size: 14px; font-weight: 600; margin-bottom: 3px; }
.note-dot { font-size: 11px; vertical-align: middle; opacity: 0.85; }
.directory-item .di-meta { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-muted); }

.status-chip {
  font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.04em; padding: 2px 7px;
  border-radius: 20px; text-transform: uppercase;
}
.status-chip.paid { background: rgba(61,107,79,0.14); color: var(--paid); }
.status-chip.delinquent { background: rgba(166,66,59,0.14); color: var(--delinquent); }

.profile-header { padding: 16px 24px 18px; border-bottom: 2px solid var(--navy); }
.profile-header .back-btn {
  display: flex; align-items: center; gap: 5px;
  padding: 6px 10px 6px 6px; margin: 0 0 14px -6px; border-radius: var(--radius-md);
  border: none; background: transparent; cursor: pointer; font-size: 12.5px; font-weight: 600;
  color: var(--ink-muted); font-family: var(--font-body);
}
.profile-header .back-btn:hover { background: var(--paper-dim); color: var(--navy); }
.profile-header .back-btn svg { width: 15px; height: 15px; flex-shrink: 0; }
.profile-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
.profile-title-text { min-width: 0; flex: 1; }
.profile-header .eyebrow { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--brass); }
.profile-header h2 { font-family: var(--font-display); font-size: 19px; margin: 6px 0 0; line-height: 1.25; }
.profile-header .status-chip { font-size: 10.5px; padding: 3px 10px; }
.profile-header .approx-note {
  font-size: 11px; color: var(--ink-muted); font-style: italic; margin-top: 6px;
}
.profile-hero-link {
  display: block; width: 100%; margin: 0 0 14px; padding: 0; border-radius: var(--radius-lg); overflow: hidden;
  border: 1px solid var(--line-strong); box-shadow: var(--shadow-soft); background: none; cursor: pointer;
}
.profile-hero-photo {
  width: 100%; height: 260px; object-fit: cover; display: block;
  transition: transform 0.2s ease;
}
.profile-hero-link:hover .profile-hero-photo { transform: scale(1.03); }

.profile-body { padding: 4px 24px 40px; }
.p-section { margin-top: 20px; }
.p-section h3 {
  font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--ink-muted); margin: 0 0 10px; padding-bottom: 8px; border-bottom: 1px solid var(--line);
}
.kv-grid { display: grid; grid-template-columns: 120px 1fr; row-gap: 9px; column-gap: 10px; font-size: 13px; }
.kv-grid dt { color: var(--ink-muted); font-family: var(--font-mono); font-size: 10.5px; padding-top: 2px; }
.kv-grid dd { margin: 0; font-weight: 500; }
.kv-grid dd.value-figure { font-family: var(--font-mono); font-size: 14.5px; font-weight: 600; color: var(--forest); }

.property-link {
  color: var(--navy); text-decoration: underline; text-decoration-color: var(--brass);
  text-underline-offset: 3px; font-weight: 600; display: inline-flex; align-items: center; gap: 5px;
}
.property-link:hover { color: var(--brass); }
.property-link svg { width: 11px; height: 11px; }

.notes-callout {
  margin-top: 12px; padding: 10px 12px; background: rgba(176,141,87,0.12);
  border-left: 3px solid var(--brass); border-radius: var(--radius-sm);
  font-size: 12px; color: var(--ink); line-height: 1.5;
}

.gallery-label {
  font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.04em; color: var(--ink-muted);
  margin: 14px 0 8px;
}
.gallery-label:first-child { margin-top: 0; }
.gallery-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px;
}
.gallery-thumb {
  display: block; width: 100%; position: relative; border-radius: var(--radius-md); overflow: hidden;
  border: 1px solid var(--line-strong); aspect-ratio: 4 / 3; background: var(--paper-dim);
  transition: transform 0.12s ease, box-shadow 0.12s ease; padding: 0; cursor: pointer;
}
.gallery-thumb:hover { transform: translateY(-2px); box-shadow: var(--shadow-soft); }
.gallery-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.gallery-thumb.doc-thumb { aspect-ratio: 3 / 4; }
.gallery-thumb .doc-label {
  position: absolute; left: 0; right: 0; bottom: 0; padding: 6px 8px;
  background: rgba(14,33,41,0.72); color: var(--paper); font-family: var(--font-mono);
  font-size: 12px; text-align: center; line-height: 1.3;
}

.notes-section-top {
  background: rgba(176,141,87,0.08); border: 1px solid var(--line-strong);
  border-radius: var(--radius-lg); padding: 14px 16px; margin-top: 4px !important;
}
.notes-section-top h3 { border-bottom-color: var(--brass); color: var(--brass); }

.notes-log { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.notes-log-empty { font-size: 12.5px; color: var(--ink-muted); font-style: italic; padding: 4px 2px 2px; }
.note-entry {
  background: var(--white); border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 9px 11px;
}
.note-entry-time {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.03em; color: var(--brass);
  text-transform: uppercase; margin-bottom: 4px;
}
.note-entry-text { font-size: 13px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }

.notes-textarea {
  width: 100%; min-height: 70px; resize: vertical; padding: 10px 12px;
  border: 1px solid var(--line-strong); border-radius: var(--radius-md);
  background: var(--white); color: var(--ink); font-family: var(--font-body);
  font-size: 13.5px; line-height: 1.5; outline: none;
}
.notes-textarea:focus { border-color: var(--brass); box-shadow: 0 0 0 2px rgba(176,141,87,0.18); }
.notes-actions { display: flex; align-items: center; gap: 10px 12px; margin-top: 10px; flex-wrap: wrap; }
.notes-save-btn {
  padding: 8px 16px; background: var(--forest); color: var(--paper); border: none;
  border-radius: var(--radius-md); font-family: var(--font-body); font-size: 13px; font-weight: 600;
  cursor: pointer; transition: background 0.15s ease;
}
.notes-save-btn:hover { background: var(--navy); }
.notes-status { font-family: var(--font-mono); font-size: 11.5px; line-height: 1.5; }
.notes-status.saved { color: var(--paid); }
.notes-status.dirty { color: var(--brass); }
.notes-status.error { color: var(--delinquent); }
.notes-status.warn { color: var(--delinquent); flex-basis: 100%; }
.notes-status.loaded { color: var(--ink-muted); font-style: italic; }

.lightbox-overlay {
  position: fixed; inset: 0; background: rgba(14,33,41,0.92); z-index: 2000;
  display: flex; align-items: center; justify-content: center; padding: 24px;
  overflow: auto; touch-action: pinch-zoom;
}
.lightbox-overlay img {
  max-width: 100%; max-height: 100%; width: auto; height: auto;
  border-radius: var(--radius-sm); box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}
.lightbox-close {
  position: fixed; top: 16px; right: 16px; width: 40px; height: 40px; border-radius: 50%;
  background: var(--paper); border: none; color: var(--navy-deep); font-size: 20px; line-height: 1;
  cursor: pointer; z-index: 2001; display: flex; align-items: center; justify-content: center;
  box-shadow: var(--shadow-soft);
}
.lightbox-caption {
  position: fixed; bottom: 16px; left: 0; right: 0; text-align: center; color: var(--paper);
  font-family: var(--font-mono); font-size: 12px; z-index: 2001;
}

.my-notes-overlay {
  position: fixed; inset: 0; background: rgba(14,33,41,0.5); z-index: 1500;
  display: flex; align-items: center; justify-content: center; padding: 24px;
}
.my-notes-panel {
  background: var(--paper); border-radius: var(--radius-lg); box-shadow: var(--shadow);
  width: 100%; max-width: 560px; max-height: 80vh; display: flex; flex-direction: column;
  overflow: hidden;
}
.my-notes-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 22px; border-bottom: 2px solid var(--navy); flex-shrink: 0;
}
.my-notes-header h2 { font-family: var(--font-display); font-size: 19px; margin: 0; }
.my-notes-close {
  width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line-strong);
  background: var(--white); cursor: pointer; font-size: 18px; color: var(--ink-muted);
  display: flex; align-items: center; justify-content: center;
}
.my-notes-list { overflow-y: auto; padding: 10px 16px 20px; }
.my-notes-empty { padding: 24px 10px; text-align: center; color: var(--ink-muted); font-size: 13px; }
.my-notes-item {
  display: block; width: 100%; text-align: left; padding: 12px 14px; border: 1px solid var(--line);
  border-radius: var(--radius-md); background: var(--white); margin: 8px 0; cursor: pointer;
}
.my-notes-item:hover { border-color: var(--brass); }
.my-notes-item .mn-title { font-family: var(--font-display); font-weight: 600; font-size: 14px; margin-bottom: 5px; }
.my-notes-item .mn-count { font-family: var(--font-mono); font-weight: 400; font-size: 10.5px; color: var(--ink-muted); }
.my-notes-item .mn-preview {
  font-size: 12.5px; color: var(--ink-muted); line-height: 1.4;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}

.phone-list, .email-list { list-style: none; margin: 0; padding: 0; }
.phone-list li, .email-list li { font-family: var(--font-mono); font-size: 12.5px; margin-bottom: 3px; }
.muted-note { color: var(--ink-muted); font-style: italic; font-size: 12.5px; }

.sales-table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
.sales-table th {
  text-align: left; font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.05em;
  text-transform: uppercase; color: var(--ink-muted); padding: 6px 7px; border-bottom: 1px solid var(--line-strong);
}
.sales-table td { padding: 7px 7px; border-bottom: 1px solid var(--line); vertical-align: top; }
.sales-table tr:last-child td { border-bottom: none; }
.sales-table td.price { font-family: var(--font-mono); color: var(--forest); font-weight: 600; white-space: nowrap; }

.relative-card { border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--white); margin-bottom: 8px; overflow: hidden; }
.relative-card summary {
  list-style: none; cursor: pointer; padding: 10px 13px; display: flex; align-items: center;
  justify-content: space-between; font-size: 13px; font-weight: 600;
}
.relative-card summary::-webkit-details-marker { display: none; }
.relative-card summary .rel-sub { font-weight: 400; font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-muted); }
.relative-card summary::after { content: '+'; font-family: var(--font-mono); color: var(--brass); font-size: 15px; }
.relative-card[open] summary::after { content: '–'; }
.relative-card .rel-body { padding: 0 13px 13px; font-size: 12.5px; border-top: 1px solid var(--line); padding-top: 10px; }
.relative-card .rel-body dl { margin: 0; display: grid; grid-template-columns: 66px 1fr; row-gap: 6px; }
.relative-card .rel-body dt { color: var(--ink-muted); font-family: var(--font-mono); font-size: 10px; }
.relative-card .rel-body dd { margin: 0; }

/* ---------------------------------- touch target sizing ---------------------------------- */
button, .directory-item, .search-result-item, .filter-toggle { touch-action: manipulation; }

/* ---------------------------------- responsive / mobile ---------------------------------- */
@media (max-width: 900px) {
  :root { --header-height: 58px; }

  .main-layout { flex-direction: column; }
  .resize-handle { display: none; }
  .map-pane { flex: 1 1 auto; width: 100%; }

  .side-panel {
    position: fixed; left: 0; right: 0; bottom: 0; top: auto;
    width: auto; max-width: none; min-width: 0; flex: none;
    height: 75vh; max-height: 75vh;
    border-left: none; border-top: 2px solid var(--brass);
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    box-shadow: 0 -10px 30px rgba(14,33,41,0.25);
    transform: translateY(100%);
    transition: transform 0.28s cubic-bezier(.32,.72,0,1);
    z-index: 500;
  }
  .side-panel.sheet-open { transform: translateY(0); }
  .side-panel::before {
    content: ''; display: block; width: 40px; height: 4px; background: var(--line-strong);
    border-radius: 4px; margin: 10px auto 0; flex-shrink: 0;
  }

  .filter-drawer { right: 10px; left: 10px; width: auto; }
  .search-wrap { max-width: none; }
  .brand-text h1 { font-size: 15px; }
  .app-header { gap: 8px; padding: 0 10px; }
  .search-results-count { display: none; }
  .map-legend { bottom: 14px; font-size: 10px; padding: 6px 9px; gap: 9px; }

  .kv-grid { grid-template-columns: 100px 1fr; }
  .profile-body { padding: 4px 18px 32px; }
  .profile-header { padding: 16px 18px 12px; }

  /* directory list hidden on mobile until explicitly wanted — map-first */
  .directory-panel { display: none; }
}

@media (max-width: 480px) {
  .brand-text .eyebrow { display: none; }
  .kv-grid { grid-template-columns: 88px 1fr; font-size: 12.5px; }
  .profile-hero-photo { height: 180px; }
  .profile-header h2 { font-size: 17px; }
}

@media (hover: none) {
  .pin:hover { transform: none; filter: none; }
}

</style>
</head>
<body>

<div id="app">

  <header class="app-header">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="20" r="19" stroke="#CBA766" stroke-width="1.5"/>
        <path d="M20 4 L23 18 L20 20 L17 18 Z" fill="#CBA766"/>
        <path d="M20 36 L17 22 L20 20 L23 22 Z" fill="#F3EEE2" fill-opacity="0.4"/>
        <circle cx="20" cy="20" r="2.6" fill="#F3EEE2"/>
      </svg>
      <div class="brand-text">
        <span class="eyebrow">Rabun County · GA</span>
        <h1>Lake Burton Property Directory</h1>
      </div>
    </div>

    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input id="searchInput" type="text" placeholder="Search address, account #, owner, or phone…" autocomplete="off" />
      <div class="search-results" id="searchResults"></div>
    </div>
    <span class="search-results-count" id="searchCount"></span>

    <button class="filter-toggle" id="myNotesToggle">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12h6M9 16h6M9 8h6M5 3h14a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/></svg>
      My Notes
    </button>

    <button class="filter-toggle" id="filterToggle">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="20" y2="12"/><line x1="12" y1="18" x2="20" y2="18"/><circle cx="6" cy="12" r="1.8" fill="currentColor"/><circle cx="9" cy="18" r="1.8" fill="currentColor"/></svg>
      Filters
    </button>
  </header>

  <div class="my-notes-overlay" id="myNotesOverlay" style="display:none;">
    <div class="my-notes-panel">
      <div class="my-notes-header">
        <h2>My Notes</h2>
        <button class="my-notes-close" id="myNotesClose" aria-label="Close">&times;</button>
      </div>
      <div class="my-notes-list" id="myNotesList"></div>
    </div>
  </div>

  <div class="main-layout" id="mainLayout">

    <div class="map-pane">
      <div id="map"></div>

      <div class="map-result-count" id="mapResultCount"></div>

      <div class="map-legend">
        <span class="legend-item"><span class="dot paid"></span> Fully Paid</span>
        <span class="legend-item"><span class="dot delinquent"></span> Tax Delinquent</span>
      </div>

      <div class="filter-drawer" id="filterDrawer">
        <h3>Filter properties</h3>

        <div class="filter-group">
          <label class="field-label">Tax status</label>
          <label class="check-row"><input type="checkbox" class="filter-status" value="Fully Paid" checked> Fully Paid</label>
          <label class="check-row"><input type="checkbox" class="filter-status" value="Tax Delinquent" checked> Tax Delinquent</label>
        </div>

        <div class="filter-group">
          <label class="field-label">Property value range</label>
          <div class="range-row">
            <input type="number" id="valueMin" placeholder="Min $" min="0" step="1000">
            <span>–</span>
            <input type="number" id="valueMax" placeholder="Max $" min="0" step="1000">
          </div>
        </div>

        <button class="filter-clear" id="filterClear">Clear filters</button>

        <div class="filter-group notes-backup-group">
          <label class="field-label">Notes backup</label>
          <div class="notes-backup-row">
            <button class="backup-btn" id="exportNotesBtn">Export Notes</button>
            <button class="backup-btn" id="importNotesBtn">Import Notes</button>
          </div>
          <input type="file" id="importNotesFile" accept="application/json" hidden>
        </div>
      </div>
    </div>

    <div class="resize-handle" id="resizeHandle"></div>

    <div class="side-panel" id="sidePanel">
      <aside class="directory-panel" id="directoryPanel">
        <div class="panel-empty-state">
          <span class="eyebrow">Directory</span>
          <h2>Select a pin on the map</h2>
          <p>Click any marker to open the full property profile — owner details, sales history, and possible relatives. Or browse the list below.</p>
        </div>
        <h3 class="directory-list-heading">Lake Properties</h3>
        <ul class="directory-list" id="directoryList"></ul>
      </aside>

      <aside class="profile-panel" id="profilePanel" style="display:none;"></aside>
    </div>

  </div>
</div>

<script>
// ---- config ----

/* ==========================================================================
   config.js — app-wide constants. Change these, nothing else, to retune
   the map's default view or data source path.
   ========================================================================== */

const CONFIG = {
  DATA_URL: 'data/properties.json',

  // Default map view — centered on Lake Burton, Rabun County, GA
  MAP_CENTER: [34.8225, -83.545],
  MAP_ZOOM: 13,
  MAP_MIN_ZOOM: 10,
  MAP_MAX_ZOOM: 19,

  TILE_URL: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  TILE_ATTRIBUTION: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors',

  // Zoom level to fly to when a property is selected (individual marker level)
  SELECT_ZOOM: 16,

  CLUSTER_RADIUS: 60,
  CLUSTER_MAX_ZOOM: 15, // stop clustering above this zoom so individual pins are selectable

  MOBILE_BREAKPOINT: 900,

  PANEL_WIDTH_STORAGE_KEY: 'lb-directory-panel-width',
};


// ---- data store ----

/* ==========================================================================
   dataStore.js — single source of truth for property data. Everything here
   is derived from data/properties.json; nothing about a specific property
   is hardcoded.
   ========================================================================== */


class DataStore {
  constructor() {
    /** @type {Array<object>} */
    this.properties = [];
    this.filters = { statuses: new Set(['Fully Paid', 'Tax Delinquent']), min: null, max: null };
  }

  async load() {
    this.properties = PROPERTY_DATA;
    return this.properties;
  }

  /** Properties with valid, mappable coordinates. */
  get mappable() {
    return this.properties.filter(p => Number.isFinite(p.lat) && Number.isFinite(p.lng));
  }

  /** Properties missing coordinates — still browsable, just not pinned. */
  get unmapped() {
    return this.properties.filter(p => !(Number.isFinite(p.lat) && Number.isFinite(p.lng)));
  }

  getById(id) {
    return this.properties.find(p => p.id === id);
  }

  setStatusFilter(statuses) {
    this.filters.statuses = new Set(statuses);
  }

  setValueRange(min, max) {
    this.filters.min = (min === null || min === '') ? null : Number(min);
    this.filters.max = (max === null || max === '') ? null : Number(max);
  }

  resetFilters() {
    this.filters = { statuses: new Set(['Fully Paid', 'Tax Delinquent']), min: null, max: null };
  }

  passesFilters(p) {
    if (!this.filters.statuses.has(p.taxStatus)) return false;
    const v = Number(p.propertyValue) || 0;
    if (this.filters.min !== null && v < this.filters.min) return false;
    if (this.filters.max !== null && v > this.filters.max) return false;
    return true;
  }

  /** Case-insensitive match across address, account #, owner name(s), and phone numbers. */
  matchesQuery(p, rawQuery) {
    const q = rawQuery.trim().toLowerCase();
    if (!q) return false;
    const haystack = [
      p.title,
      p.accountNumber,
      ...(p.owner?.names || []),
      ...(p.owner?.phones || []),
      ...(p.relatives || []).flatMap(r => r.phones || []),
    ];
    return haystack.some(h => h && String(h).toLowerCase().includes(q));
  }

  /** Full result set after filters + search, used by both the map and the list. */
  getVisible(query = '') {
    return this.properties.filter(p => this.passesFilters(p) && (!query || this.matchesQuery(p, query)));
  }

  search(query, limit = 20) {
    if (!query.trim()) return [];
    return this.properties
      .filter(p => this.passesFilters(p) && this.matchesQuery(p, query))
      .slice(0, limit);
  }
}


// ---- map controller ----

/* ==========================================================================
   mapController.js — owns the Leaflet map, marker clustering, and the
   visual selection state (active / dimmed pins). No knowledge of the
   panel or search UI lives here; it only exposes callbacks.
   ========================================================================== */


class MapController {
  /**
   * @param {string} elId - id of the map container element
   * @param {(id: string) => void} onPinClick - called when a pin is clicked
   */
  constructor(elId, onPinClick) {
    this.onPinClick = onPinClick;
    this.markersById = new Map();
    this.activeId = null;

    this.map = L.map(elId, {
      center: CONFIG.MAP_CENTER,
      zoom: CONFIG.MAP_ZOOM,
      minZoom: CONFIG.MAP_MIN_ZOOM,
      maxZoom: CONFIG.MAP_MAX_ZOOM,
      zoomControl: false,
      attributionControl: true,
    });

    L.control.zoom({ position: 'topright' }).addTo(this.map);

    L.tileLayer(CONFIG.TILE_URL, {
      maxZoom: CONFIG.MAP_MAX_ZOOM,
      attribution: CONFIG.TILE_ATTRIBUTION,
    }).addTo(this.map);

    this.clusterGroup = L.markerClusterGroup({
      maxClusterRadius: CONFIG.CLUSTER_RADIUS,
      disableClusteringAtZoom: CONFIG.CLUSTER_MAX_ZOOM,
      showCoverageOnHover: false,
      spiderfyOnMaxZoom: true,
      iconCreateFunction: (cluster) => this._clusterIcon(cluster),
    });
    this.map.addLayer(this.clusterGroup);

    this.map.on('click', () => this.onPinClick(null));
  }

  _clusterIcon(cluster) {
    const count = cluster.getChildCount();
    const sizeClass = count < 10 ? 'size-sm' : count < 30 ? 'size-md' : 'size-lg';
    return L.divIcon({
      html: `<div class="lb-cluster ${sizeClass}"><span>${count}</span></div>`,
      className: '',
      iconSize: null,
    });
  }

  _pinIconHtml(status) {
    return `
      <svg viewBox="0 0 15 19">
        <path class="pin-body" d="M7.5 0C3.36 0 0 3.3 0 7.4 0 12.7 7.5 19 7.5 19S15 12.7 15 7.4C15 3.3 11.64 0 7.5 0Z"></path>
        <circle class="pin-dot" cx="7.5" cy="7.2" r="2.4"></circle>
      </svg>`;
  }

  _statusClass(status) {
    return status === 'Tax Delinquent' ? 'delinquent' : 'paid';
  }

  /**
   * (Re)render every marker from the given property list. Safe to call
   * again if the underlying data set changes (e.g. hot-reload of JSON).
   */
  renderMarkers(properties) {
    this.clusterGroup.clearLayers();
    this.markersById.clear();

    properties.forEach(p => {
      if (!Number.isFinite(p.lat) || !Number.isFinite(p.lng)) return; // unmapped — skip pin

      const icon = L.divIcon({
        className: `pin status-${this._statusClass(p.taxStatus)}`,
        html: this._pinIconHtml(p.taxStatus),
        iconSize: [15, 19],
        iconAnchor: [7, 19],
      });

      const marker = L.marker([p.lat, p.lng], { icon, riseOnHover: true });
      marker.bindTooltip(p.title, { direction: 'top', offset: [0, -16], className: 'pin-tooltip' });
      marker.on('click', (e) => {
        L.DomEvent.stopPropagation(e);
        this.onPinClick(p.id);
      });

      this.markersById.set(p.id, marker);
      this.clusterGroup.addLayer(marker);
    });

    this._applyVisualState();
  }

  /** Show/hide markers according to the visible-id set (from filters/search). */
  setVisibleIds(visibleIds) {
    const visibleSet = new Set(visibleIds);
    this.markersById.forEach((marker, id) => {
      const shouldShow = visibleSet.has(id);
      const hasLayer = this.clusterGroup.hasLayer(marker);
      if (shouldShow && !hasLayer) this.clusterGroup.addLayer(marker);
      if (!shouldShow && hasLayer) this.clusterGroup.removeLayer(marker);
    });
    this._applyVisualState();
  }

  /** Select a property: fly/zoom to it, expand its cluster, highlight it, dim the rest. */
  select(id) {
    this.activeId = id;
    const marker = id ? this.markersById.get(id) : null;

    if (marker) {
      // zoomToShowLayer expands any ancestor cluster and zooms just enough
      // to reveal this specific marker, then fires the callback.
      this.clusterGroup.zoomToShowLayer(marker, () => {
        this.map.flyTo(marker.getLatLng(), Math.max(this.map.getZoom(), CONFIG.SELECT_ZOOM), { duration: 0.6 });
        this._applyVisualState();
      });
    } else {
      this._applyVisualState();
    }
  }

  clearSelection() {
    this.activeId = null;
    this._applyVisualState();
  }

  _applyVisualState() {
    this.markersById.forEach((marker, id) => {
      const el = marker.getElement ? marker.getElement() : (marker._icon || null);
      if (!el) return; // not currently rendered (inside a cluster) — nothing to style
      el.classList.remove('is-active', 'is-dimmed');
      if (this.activeId) {
        el.classList.add(id === this.activeId ? 'is-active' : 'is-dimmed');
      }
    });
  }

  fitToAll() {
    const latLngs = [];
    this.markersById.forEach(m => latLngs.push(m.getLatLng()));
    if (latLngs.length) this.map.fitBounds(L.latLngBounds(latLngs).pad(0.15));
  }

  invalidateSize() {
    this.map.invalidateSize();
  }
}


// ---- ui controller ----

/* ==========================================================================
   uiController.js — everything that touches the DOM outside the map itself:

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}

function fmtCurrency(n) {
  if (n === null || n === undefined || n === '') return '—';
  return Number(n).toLocaleString('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
}

function statusClass(status) {
  return status === 'Tax Delinquent' ? 'delinquent' : 'paid';
}

class UIController {
  /**
   * @param {import('./dataStore.js').DataStore} store
   * @param {(id: string|null) => void} onSelect - called with a property id (or null to clear)
   */
  constructor(store, onSelect) {
    this.store = store;
    this.onSelect = onSelect;
    this.activeId = null;
    this._notesMemory = {}; // in-session fallback if localStorage is unavailable/blocked
    this._storageOk = this._testStorage();

    this.els = {
      searchInput: document.getElementById('searchInput'),
      searchResults: document.getElementById('searchResults'),
      searchCount: document.getElementById('searchCount'),
      filterToggle: document.getElementById('filterToggle'),
      filterDrawer: document.getElementById('filterDrawer'),
      filterClear: document.getElementById('filterClear'),
      valueMin: document.getElementById('valueMin'),
      valueMax: document.getElementById('valueMax'),
      statusChecks: document.querySelectorAll('.filter-status'),
      directoryPanel: document.getElementById('directoryPanel'),
      directoryList: document.getElementById('directoryList'),
      profilePanel: document.getElementById('profilePanel'),
      sidePanel: document.getElementById('sidePanel'),
      resizeHandle: document.getElementById('resizeHandle'),
      mapResultCount: document.getElementById('mapResultCount'),
      exportNotesBtn: document.getElementById('exportNotesBtn'),
      importNotesBtn: document.getElementById('importNotesBtn'),
      importNotesFile: document.getElementById('importNotesFile'),
      myNotesToggle: document.getElementById('myNotesToggle'),
      myNotesOverlay: document.getElementById('myNotesOverlay'),
      myNotesClose: document.getElementById('myNotesClose'),
      myNotesList: document.getElementById('myNotesList'),
    };

    this._wireSearch();
    this._wireFilters();
    this._wireResize();
    this._wireNotesBackup();
    this._wireMyNotes();
  }

  _testStorage() {
    try {
      const k = '__lb_storage_test__';
      localStorage.setItem(k, '1');
      const ok = localStorage.getItem(k) === '1';
      localStorage.removeItem(k);
      return ok;
    } catch (_) {
      return false;
    }
  }

  // ---------------------------------------------------------------- search
  _wireSearch() {
    const { searchInput, searchResults } = this.els;

    searchInput.addEventListener('input', () => {
      const q = searchInput.value.trim();
      if (!q) { searchResults.classList.remove('open'); searchResults.innerHTML = ''; return; }
      const results = this.store.search(q, 20);
      this._renderSearchResults(results);
    });

    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const q = searchInput.value.trim();
        const [first] = this.store.search(q, 1);
        if (first) this._chooseResult(first.id);
      } else if (e.key === 'Escape') {
        searchResults.classList.remove('open');
        searchInput.blur();
      }
    });

    document.addEventListener('click', (e) => {
      if (!searchResults.contains(e.target) && e.target !== searchInput) {
        searchResults.classList.remove('open');
      }
    });
  }

  _renderSearchResults(results) {
    const { searchResults } = this.els;
    if (!results.length) {
      searchResults.innerHTML = `<div class="search-results-empty">No matches</div>`;
      searchResults.classList.add('open');
      return;
    }
    searchResults.innerHTML = results.map(p => `
      <button class="search-result-item" data-id="${escapeHtml(p.id)}">
        <div class="sr-title">${escapeHtml(p.title)}</div>
        <div class="sr-meta">${escapeHtml(p.accountNumber)} · ${escapeHtml((p.owner?.names || [])[0] || '')}</div>
      </button>
    `).join('');
    searchResults.querySelectorAll('.search-result-item').forEach(btn => {
      btn.addEventListener('click', () => this._chooseResult(btn.dataset.id));
    });
    searchResults.classList.add('open');
  }

  _chooseResult(id) {
    this.els.searchResults.classList.remove('open');
    this.els.searchInput.value = '';
    this.onSelect(id); // zoom + highlight + open profile, per spec
  }

  // ---------------------------------------------------------------- filters
  _wireFilters() {
    const { filterToggle, filterDrawer, statusChecks, valueMin, valueMax, filterClear } = this.els;

    filterToggle.addEventListener('click', () => {
      filterDrawer.classList.toggle('open');
      filterToggle.classList.toggle('active');
    });
    document.addEventListener('click', (e) => {
      if (!filterDrawer.contains(e.target) && !filterToggle.contains(e.target)) {
        filterDrawer.classList.remove('open');
        filterToggle.classList.remove('active');
      }
    });

    statusChecks.forEach(cb => cb.addEventListener('change', () => {
      const checked = [...this.els.statusChecks].filter(c => c.checked).map(c => c.value);
      this.store.setStatusFilter(checked);
      this.onFiltersChanged?.();
    }));

    [valueMin, valueMax].forEach(input => input.addEventListener('input', () => {
      this.store.setValueRange(valueMin.value, valueMax.value);
      this.onFiltersChanged?.();
    }));

    filterClear.addEventListener('click', () => {
      this.els.statusChecks.forEach(cb => cb.checked = true);
      valueMin.value = ''; valueMax.value = '';
      this.store.resetFilters();
      this.onFiltersChanged?.();
    });
  }

  // ---------------------------------------------------------------- resize
  _wireResize() {
    const { resizeHandle, sidePanel } = this.els;
    if (!resizeHandle) return;

    let dragging = false;

    const startDrag = (clientX) => {
      dragging = true;
      resizeHandle.classList.add('dragging');
      document.body.style.userSelect = 'none';
    };
    const drag = (clientX) => {
      if (!dragging) return;
      const newWidth = window.innerWidth - clientX;
      const min = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--panel-min'));
      const max = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--panel-max'));
      const clamped = Math.min(max, Math.max(min, newWidth));
      document.documentElement.style.setProperty('--panel-width', `${clamped}px`);
      this.onResize?.();
    };
    const endDrag = () => {
      if (!dragging) return;
      dragging = false;
      resizeHandle.classList.remove('dragging');
      document.body.style.userSelect = '';
      try {
        const width = getComputedStyle(document.documentElement).getPropertyValue('--panel-width');
        localStorage.setItem(CONFIG.PANEL_WIDTH_STORAGE_KEY, width.trim());
      } catch (_) { /* storage unavailable — non-fatal */ }
    };

    resizeHandle.addEventListener('mousedown', (e) => { startDrag(e.clientX); e.preventDefault(); });
    window.addEventListener('mousemove', (e) => drag(e.clientX));
    window.addEventListener('mouseup', endDrag);

    resizeHandle.addEventListener('touchstart', (e) => startDrag(e.touches[0].clientX), { passive: true });
    window.addEventListener('touchmove', (e) => drag(e.touches[0].clientX), { passive: true });
    window.addEventListener('touchend', endDrag);

    // restore a saved width
    try {
      const saved = localStorage.getItem(CONFIG.PANEL_WIDTH_STORAGE_KEY);
      if (saved) document.documentElement.style.setProperty('--panel-width', saved);
    } catch (_) { /* ignore */ }
  }

  // ---------------------------------------------------------------- directory
  renderDirectory(properties) {
    const { directoryList } = this.els;
    const sorted = [...properties].sort((a, b) => a.title.localeCompare(b.title));
    const notedIds = new Set(Object.keys(this._allSavedNotes()));
    directoryList.innerHTML = sorted.map(p => `
      <li>
        <button class="directory-item" data-id="${escapeHtml(p.id)}">
          <div class="di-title">${escapeHtml(p.title)} ${notedIds.has(p.id) ? '<span class="note-dot" title="Has a saved note">📝</span>' : ''}</div>
          <div class="di-meta">
            <span>${escapeHtml(p.accountNumber)}</span>
          </div>
        </button>
      </li>
    `).join('') || `<li class="muted-note" style="padding:12px 4px; list-style:none;">No properties match your filters.</li>`;

    directoryList.querySelectorAll('.directory-item').forEach(btn => {
      btn.addEventListener('click', () => this.onSelect(btn.dataset.id));
    });
  }

  updateResultCount(count, total) {
    this.els.searchCount.textContent = '';
    if (this.els.mapResultCount) {
      this.els.mapResultCount.textContent = count === total
        ? `${total} propert${total === 1 ? 'y' : 'ies'}`
        : `${count} of ${total} properties`;
    }
  }

  // ---------------------------------------------------------------- selection / panels
  showDirectory() {
    this.activeId = null;
    this.els.directoryPanel.style.display = 'block';
    this.els.profilePanel.style.display = 'none';
    this._setMobileSheet(this.els.directoryPanel, false);
  }

  showProfile(property) {
    this.activeId = property.id;
    this._renderProfile(property);
    this.els.directoryPanel.style.display = 'none';
    this.els.profilePanel.style.display = 'block';
    this._setMobileSheet(this.els.profilePanel, true);
  }

  _setMobileSheet(panelEl, open) {
    if (window.innerWidth > CONFIG.MOBILE_BREAKPOINT) return;
    document.querySelectorAll('.side-panel .directory-panel, .side-panel .profile-panel')
      .forEach(p => p.classList.remove('sheet-open'));
    if (open) panelEl.classList.add('sheet-open');
    this.els.sidePanel.classList.toggle('sheet-open', open);
  }

  _renderProfile(p) {
    const chip = `<span class="status-chip ${statusClass(p.taxStatus)}">${escapeHtml(p.taxStatus)}</span>`;

    const ownerNames = (p.owner?.names || []).map(n => escapeHtml(n)).join('<br>') || '—';
    const phones = (p.owner?.phones || []);
    const phonesHtml = phones.length
      ? `<ul class="phone-list">${phones.map(ph => `<li>${escapeHtml(ph)}</li>`).join('')}</ul>`
      : `<span class="muted-note">None on file</span>`;
    const emails = (p.owner?.emails || []);
    const emailsHtml = emails.length
      ? `<ul class="email-list">${emails.map(em => `<li>${escapeHtml(em)}</li>`).join('')}</ul>`
      : `<span class="muted-note">None</span>`;

    const salesRows = (p.salesHistory || []).map(s => `
      <tr>
        <td>${escapeHtml(s.saleDate)}</td>
        <td>${escapeHtml(s.deedBookPage)}</td>
        <td class="price">${escapeHtml(s.salePrice)}</td>
        <td>${escapeHtml(s.grantor)}</td>
        <td>${escapeHtml(s.grantee)}</td>
      </tr>`).join('');

    const salesTable = (p.salesHistory && p.salesHistory.length)
      ? `<table class="sales-table">
           <thead><tr><th>Sale Date</th><th>Deed Book/Page</th><th>Sale Price</th><th>Grantor</th><th>Grantee</th></tr></thead>
           <tbody>${salesRows}</tbody>
         </table>`
      : `<span class="muted-note">No sales history on file</span>`;

    const relativeCards = (p.relatives || []).map(r => `
      <details class="relative-card">
        <summary>${escapeHtml(r.name)} <span class="rel-sub">${escapeHtml(r.relationship || '')}</span></summary>
        <div class="rel-body">
          <dl>
            <dt>Age</dt><dd>${escapeHtml(r.age || '—')}</dd>
            <dt>Relationship</dt><dd>${escapeHtml(r.relationship || '—')}</dd>
            <dt>Address</dt><dd>${escapeHtml(r.address || '—')}</dd>
            <dt>Phone(s)</dt><dd>${(r.phones && r.phones.length) ? r.phones.map(escapeHtml).join('<br>') : '—'}</dd>
          </dl>
        </div>
      </details>`).join('');

    const relativesHtml = (p.relatives && p.relatives.length) ? relativeCards : `<span class="muted-note">None on file</span>`;

    const approxNote = p.locationApproximate
      ? `<div class="approx-note">Map location is approximate — no exact address on file.</div>`
      : '';

    const photoThumbs = (p.photos || []).slice(1).map((url, i) => `
      <button type="button" class="gallery-thumb" data-full="${escapeHtml(url)}" data-caption="${escapeHtml(p.title)} — photo ${i + 2}">
        <img src="${escapeHtml(url)}" alt="Photo ${i + 2} of ${escapeHtml(p.title)}">
      </button>`).join('');

    const documentThumbs = (p.documents || []).map((d, i) => `
      <button type="button" class="gallery-thumb doc-thumb" data-full="${escapeHtml(d.url)}" data-caption="${escapeHtml(d.label || `Document ${i + 1}`)}">
        <img src="${escapeHtml(d.url)}" alt="${escapeHtml(d.label || `Document ${i + 1}`)}">
        <span class="doc-label">${escapeHtml(d.label || `Page ${i + 1}`)}</span>
      </button>`).join('');

    const hasMorePhotos = p.photos && p.photos.length > 1;
    const hasDocs = p.documents && p.documents.length;

    const photosDocsSection = (hasMorePhotos || hasDocs) ? `
        <section class="p-section">
          <h3>Photos &amp; Documents</h3>
          ${hasMorePhotos ? `<div class="gallery-grid">${photoThumbs}</div>` : ''}
          ${hasDocs ? `<div class="gallery-label">Deed — ${p.documents.length} page${p.documents.length === 1 ? '' : 's'}</div><div class="gallery-grid">${documentThumbs}</div>` : ''}
        </section>` : '';

    this.els.profilePanel.innerHTML = `
      <div class="profile-header">
        <button class="back-btn" id="profileBackBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 18l-6-6 6-6"/></svg>
          Back to directory
        </button>
        ${(p.photos && p.photos[0]) ? `<button type="button" class="profile-hero-link" data-full="${escapeHtml(p.photos[0])}" data-caption="${escapeHtml(p.title)}"><img class="profile-hero-photo" src="${escapeHtml(p.photos[0])}" alt="Photo of ${escapeHtml(p.title)}"></button>` : ''}
        <div class="profile-title-row">
          <div class="profile-title-text">
            <span class="eyebrow">Account No. ${escapeHtml(p.accountNumber)}</span>
            <h2><a class="property-link" href="${escapeHtml(p.propertyLink)}" target="_blank" rel="noopener noreferrer">
              ${escapeHtml(p.title)}
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M7 17L17 7M9 7h8v8"/></svg>
            </a></h2>
            ${approxNote}
          </div>
        </div>
      </div>
      <div class="profile-body">

        <section class="p-section notes-section-top">
          <h3>Notes</h3>
          <div class="notes-log" id="notesLog">${this._renderNotesLog(this._loadEntries(p.id))}</div>
          <textarea class="notes-textarea" id="notesTextarea" placeholder="Add a new note — call outcomes, follow-ups, anything worth remembering…"></textarea>
          <div class="notes-actions">
            <button class="notes-save-btn" id="notesSaveBtn">Add Note</button>
            <span class="notes-status" id="notesStatus"></span>
          </div>
        </section>

        <section class="p-section">
          <h3>Property Information</h3>
          <dl class="kv-grid">
            <dt>Account No.</dt><dd>${escapeHtml(p.accountNumber)}</dd>
            <dt>Address</dt><dd><a class="property-link" href="${escapeHtml(p.propertyLink)}" target="_blank" rel="noopener noreferrer">${escapeHtml(p.title)}</a></dd>
            <dt>Tax Status</dt><dd>${chip}</dd>
            <dt>Property Value</dt><dd class="value-figure">${fmtCurrency(p.propertyValue)}</dd>
            ${p.taxHistoryLink ? `<dt>Tax History</dt><dd><a class="property-link" href="${escapeHtml(p.taxHistoryLink)}" target="_blank" rel="noopener noreferrer">View tax bill</a></dd>` : ''}
          </dl>
          ${p.notes ? `<div class="notes-callout">${escapeHtml(p.notes)}</div>` : ''}
        </section>

        <section class="p-section">

          <h3>Owner Information</h3>
          <dl class="kv-grid">
            <dt>Owner(s)</dt><dd>${ownerNames}</dd>
            <dt>Mailing Address</dt><dd>${escapeHtml(p.owner?.mailingAddress || '—')}</dd>
            <dt>Phone Numbers</dt><dd>${phonesHtml}</dd>
            <dt>Emails</dt><dd>${emailsHtml}</dd>
          </dl>
        </section>

        <section class="p-section">
          <h3>Sales History</h3>
          ${salesTable}
        </section>

        <section class="p-section">
          <h3>Possible Relatives</h3>
          ${relativesHtml}
        </section>

        ${photosDocsSection}

      </div>
    `;

    document.getElementById('profileBackBtn').addEventListener('click', () => this.onSelect(null));
    this._wireNotes(p.id);
    this._wireLightboxTriggers();
  }

  _wireLightboxTriggers() {
    this.els.profilePanel.querySelectorAll('[data-full]').forEach(el => {
      el.addEventListener('click', () => this._openLightbox(el.dataset.full, el.dataset.caption || ''));
    });
  }

  _openLightbox(url, caption) {
    const overlay = document.createElement('div');
    overlay.className = 'lightbox-overlay';
    const safeCaption = caption ? caption.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;') : '';
    overlay.innerHTML = `
      <button class="lightbox-close" aria-label="Close">&times;</button>
      <img src="${url}" alt="${safeCaption || 'Full-size view'}">
      ${safeCaption ? `<div class="lightbox-caption">${safeCaption}</div>` : ''}
    `;
    const close = () => overlay.remove();
    overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
    overlay.querySelector('.lightbox-close').addEventListener('click', close);
    document.addEventListener('keydown', function onKey(e) {
      if (e.key === 'Escape') { close(); document.removeEventListener('keydown', onKey); }
    });
    document.body.appendChild(overlay);
  }

  // ---------------------------------------------------------------- notes (saved locally in this browser)
  _noteKey(id) {
    return `lb-directory-note:${id}`;
  }

  /** Always updates the in-memory copy; also tries localStorage and reports whether that part actually worked. */
  _saveRaw(id, rawString) {
    this._notesMemory[id] = rawString;
    if (!this._storageOk) return { ok: true, persisted: false };
    try {
      localStorage.setItem(this._noteKey(id), rawString);
      const readBack = localStorage.getItem(this._noteKey(id));
      return { ok: true, persisted: readBack === rawString };
    } catch (_) {
      return { ok: true, persisted: false };
    }
  }

  /** Parses a stored raw string into an array of {text, time} entries. Understands the old
   *  single-string format (pre-notepad-log) and upgrades it into a single entry on the fly. */
  _parseEntries(raw) {
    if (!raw) return [];
    try {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed)) return parsed.filter(e => e && e.text);
    } catch (_) { /* not JSON — must be a legacy plain-string note */ }
    return [{ text: raw, time: null }];
  }

  _loadEntries(id) {
    const raw = Object.prototype.hasOwnProperty.call(this._notesMemory, id)
      ? this._notesMemory[id]
      : (() => { try { return localStorage.getItem(this._noteKey(id)) || ''; } catch (_) { return ''; } })();
    return this._parseEntries(raw);
  }

  /** Appends a new entry to this property's log — never overwrites earlier entries. */
  _addEntry(id, text) {
    const entries = this._loadEntries(id);
    entries.push({ text, time: new Date().toISOString() });
    const result = this._saveRaw(id, JSON.stringify(entries));
    return { ...result, entries };
  }

  _allSavedNotes() {
    const out = {};
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key && key.startsWith('lb-directory-note:')) {
          const id = key.slice('lb-directory-note:'.length);
          const val = localStorage.getItem(key);
          if (val) out[id] = val;
        }
      }
    } catch (_) { /* storage unavailable — memory copy below still covers this session */ }
    Object.assign(out, this._notesMemory); // session edits win over a possibly-stale storage read
    // drop empties
    Object.keys(out).forEach(k => { if (!out[k]) delete out[k]; });
    return out;
  }

  _wireNotesBackup() {
    const { exportNotesBtn, importNotesBtn, importNotesFile } = this.els;
    if (!exportNotesBtn) return;

    exportNotesBtn.addEventListener('click', () => {
      const notes = this._allSavedNotes();
      const titled = {};
      Object.entries(notes).forEach(([id, raw]) => {
        const p = this.store.getById(id);
        titled[id] = { title: p ? p.title : id, entries: this._parseEntries(raw) };
      });
      const blob = new Blob([JSON.stringify(titled, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const stamp = new Date().toISOString().slice(0, 10);
      a.href = url;
      a.download = `lake-burton-notes-${stamp}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    });

    importNotesBtn?.addEventListener('click', () => importNotesFile?.click());
    importNotesFile?.addEventListener('change', () => {
      const file = importNotesFile.files && importNotesFile.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(String(reader.result));
          let count = 0;
          Object.entries(parsed).forEach(([id, entry]) => {
            // accept the current {entries:[...]} export format, and older single-note exports too
            const incoming = Array.isArray(entry?.entries)
              ? entry.entries.filter(e => e && e.text)
              : (entry?.note ? [{ text: entry.note, time: null }] : []);
            if (!incoming.length) return;
            const existing = this._loadEntries(id);
            const existingTexts = new Set(existing.map(e => `${e.time || ''}|${e.text}`));
            const merged = existing.concat(incoming.filter(e => !existingTexts.has(`${e.time || ''}|${e.text}`)));
            this._saveRaw(id, JSON.stringify(merged));
            count++;
          });
          // if the currently open profile is one of the imported notes, refresh its log live
          const log = document.getElementById('notesLog');
          if (log && this.activeId && parsed[this.activeId]) {
            log.innerHTML = this._renderNotesLog(this._loadEntries(this.activeId));
          }
          this.onNotesChanged?.();
          alert(`Imported notes for ${count} propert${count === 1 ? 'y' : 'ies'}.`);
        } catch (err) {
          alert('Could not read that file — make sure it\'s a notes export from this app.');
        }
        importNotesFile.value = '';
      };
      reader.readAsText(file);
    });
  }

  _wireMyNotes() {
    const { myNotesToggle, myNotesOverlay, myNotesClose, myNotesList } = this.els;
    if (!myNotesToggle) return;

    const open = () => {
      this._renderMyNotesList();
      myNotesOverlay.style.display = 'flex';
    };
    const close = () => { myNotesOverlay.style.display = 'none'; };

    myNotesToggle.addEventListener('click', open);
    myNotesClose.addEventListener('click', close);
    myNotesOverlay.addEventListener('click', (e) => { if (e.target === myNotesOverlay) close(); });
  }

  _renderMyNotesList() {
    const notes = this._allSavedNotes();
    const rows = Object.entries(notes)
      .map(([id, raw]) => ({ id, entries: this._parseEntries(raw), property: this.store.getById(id) }))
      .filter(e => e.property && e.entries.length); // drop orphans and empties

    if (!rows.length) {
      this.els.myNotesList.innerHTML = `<div class="my-notes-empty">No notes saved on this device yet. Open any property and use the Notes box to add one.</div>`;
      return;
    }

    rows.sort((a, b) => a.property.title.localeCompare(b.property.title));

    this.els.myNotesList.innerHTML = rows.map(r => {
      const latest = r.entries[r.entries.length - 1];
      const countLabel = r.entries.length > 1 ? ` · ${r.entries.length} entries` : '';
      return `
      <button class="my-notes-item" data-id="${escapeHtml(r.id)}">
        <div class="mn-title">${escapeHtml(r.property.title)}<span class="mn-count">${countLabel}</span></div>
        <div class="mn-preview">${escapeHtml(latest.text)}</div>
      </button>`;
    }).join('');

    this.els.myNotesList.querySelectorAll('.my-notes-item').forEach(btn => {
      btn.addEventListener('click', () => {
        this.els.myNotesOverlay.style.display = 'none';
        this.onSelect(btn.dataset.id);
      });
    });
  }

  _formatEntryTime(iso) {
    if (!iso) return 'Earlier';
    const d = new Date(iso);
    if (isNaN(d.getTime())) return 'Earlier';
    const today = new Date();
    const sameDay = d.toDateString() === today.toDateString();
    const datePart = sameDay ? 'Today' : d.toLocaleDateString([], { month: 'short', day: 'numeric' });
    const timePart = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    return `${datePart}, ${timePart}`;
  }

  _renderNotesLog(entries) {
    if (!entries.length) {
      return `<div class="notes-log-empty">No notes yet — add the first one below.</div>`;
    }
    // newest first
    return [...entries].reverse().map(e => `
      <div class="note-entry">
        <div class="note-entry-time">${escapeHtml(this._formatEntryTime(e.time))}</div>
        <div class="note-entry-text">${escapeHtml(e.text)}</div>
      </div>
    `).join('');
  }

  _wireNotes(id) {
    const textarea = document.getElementById('notesTextarea');
    const saveBtn = document.getElementById('notesSaveBtn');
    const status = document.getElementById('notesStatus');
    const log = document.getElementById('notesLog');

    if (!this._storageOk) {
      status.textContent = 'Browser storage unavailable — notes save for this session only. Use Export Notes to keep a permanent copy.';
      status.className = 'notes-status warn';
    }

    saveBtn.addEventListener('click', () => {
      const text = textarea.value.trim();
      if (!text) return;
      const result = this._addEntry(id, text);
      log.innerHTML = this._renderNotesLog(result.entries);
      textarea.value = '';
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      if (result.persisted) {
        status.textContent = `Added ✓ ${time}`;
        status.className = 'notes-status saved';
      } else {
        status.textContent = `Added for this session (${time}) — browser storage is blocked here. Click "Export Notes" above to keep a permanent copy.`;
        status.className = 'notes-status warn';
      }
      this.onNotesChanged?.();
      textarea.focus();
    });
  }
}


// ---- app ----

/* ==========================================================================
   app.js — composition root. Instantiates the three modules and connects
   their callbacks. No rendering logic lives here.
   ========================================================================== */


async function main() {
  const store = new DataStore();

  const select = (id) => {
    if (id) {
      const property = store.getById(id);
      if (!property) return;
      ui.showProfile(property);
      map.select(id);
    } else {
      ui.showDirectory();
      map.clearSelection();
    }
  };

  const map = new MapController('map', select);
  const ui = new UIController(store, select);

  ui.onFiltersChanged = () => refresh();
  ui.onResize = () => map.invalidateSize();
  ui.onNotesChanged = () => refresh();

  function refresh() {
    const query = ui.els.searchInput.value.trim();
    const visible = store.getVisible(query);
    const visibleIds = visible.map(p => p.id);
    map.setVisibleIds(visibleIds);
    ui.renderDirectory(visible);
    ui.updateResultCount(visible.length, store.properties.length);
  }

  try {
    await store.load();
  } catch (err) {
    console.error(err);
    document.getElementById('directoryList').innerHTML =
      `<li class="muted-note" style="padding:12px 4px; list-style:none;">Could not load property data. If you opened this file directly in a browser, run a local server instead (see README.md) — browsers block JSON file:// requests.</li>`;
    return;
  }

  map.renderMarkers(store.mappable);
  refresh();

  window.addEventListener('resize', () => map.invalidateSize());
}

main();
